<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#173f35"><title>我的帳本</title><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/app.css?v=32"><link rel="stylesheet" href="/menu.css?v=20"><script src="/offline.js?v=3" defer></script></head>
<body><header><div><p class="eyebrow">PERSONAL ACCOUNTING</p><h1>我的帳本</h1></div><label class="privacy-check"><input type="checkbox" id="privacy-toggle" aria-label="隱藏金額"><span>遮蔽</span></label></header><main><div class="date-nav"><button id="previous" class="secondary" aria-label="上個月">‹</button><input id="month" type="month" aria-label="月份"><button id="next" class="secondary" aria-label="下個月">›</button></div><section id="summary" class="summary" aria-label="資料摘要"></section><nav class="view-tabs" aria-label="主要頁面"><button class="active" data-view="ledger">交易</button><button data-view="report">分類統計</button><button data-view="balances">帳戶餘額</button></nav><section id="ledger-view" class="view"><div class="section-title"><h2>交易</h2><span id="range" class="muted"></span></div><div class="filters"><input id="search" type="search" placeholder="搜尋摘要" aria-label="搜尋摘要"></div><div id="transactions" class="transactions"><p class="muted">載入中…</p></div></section><section id="report-view" class="view" hidden><div class="section-title"><h2>分類統計</h2></div><div id="category-report" class="category-report"></div></section><section id="balances-view" class="view" hidden><div class="section-title"><h2>帳戶餘額</h2><span class="muted">截至所選月份月底</span></div><div id="balances" class="balance-list"></div></section></main><button id="add" class="floating" aria-label="新增交易">＋</button><button id="scroll-top" class="floating scroll-top" aria-label="回到最上面" hidden><span class="bar">一</span><span class="arrow">↑</span></button><dialog id="entry-dialog" class="entry-sheet"><form id="entry-form"><div class="dialog-title"><div><p class="eyebrow dark">NEW ENTRY</p><h2>新增帳務</h2></div><button type="button" class="icon-button" id="close" aria-label="關閉">×</button></div><div class="date-nav"><button type="button" id="entry-date-prev" class="secondary" aria-label="上一天">‹</button><input id="entry-date" type="date" required aria-label="日期"><button type="button" id="entry-date-next" class="secondary" aria-label="下一天">›</button></div><label class="compact-label">類型<select id="entry-type"><option value="expense">支出</option><option value="income">收入</option><option value="transfer">轉帳</option></select></label><div id="simple-entry"><label id="credit-label" class="account-field"><span>付款帳戶</span><select id="credit-account" required></select></label><div class="flow-arrow">↓</div><label id="debit-label" class="account-field"><span>分類</span><select id="debit-account" required></select></label><label class="amount-field"><span>金額</span><div><small>NT$</small><input id="entry-amount" type="number" min="1" step="1" inputmode="numeric" placeholder="0" required></div></label></div><div id="split-entry" hidden><div class="section-title"><h3>拆分分錄</h3><button type="button" class="small-button secondary" id="add-create-entry">＋ 新增分錄</button></div><div id="create-entries" class="entry-list"></div></div><button type="button" class="text-button" id="toggle-split">使用拆分交易</button><label>摘要<input id="entry-memo" maxlength="500" autocomplete="off" placeholder="例如：午餐、超市採買"></label><p id="form-error" class="error" role="alert"></p><div class="form-actions"><button type="button" class="secondary" id="save-and-new">儲存並繼續</button><button type="submit">儲存</button></div></form></dialog><dialog id="detail-dialog"><form id="detail-form"><div class="dialog-title"><div style="display:flex;align-items:center;justify-content:center;gap:10px"><h2>交易明細</h2><button type="button" id="detail-title-delete" aria-label="刪除交易" title="刪除交易" style="width:auto;padding:8px 14px;font-size:14px;border-radius:10px;background:#a43d35;color:white">刪除</button></div><button type="button" class="icon-button" id="detail-close" aria-label="關閉">×</button></div><input id="detail-id" type="hidden"><div class="date-nav"><button type="button" id="detail-date-prev" class="secondary" aria-label="上一天">‹</button><input id="detail-date" type="date" required aria-label="日期"><button type="button" id="detail-date-next" class="secondary" aria-label="下一天">›</button></div><label>摘要<input id="detail-memo" maxlength="500"></label><div class="section-title"><h3>分錄</h3><button type="button" class="small-button secondary" id="add-entry">新增分錄</button></div><div id="detail-entries" class="entry-list"></div><p id="legacy-note" class="notice" hidden>這是 E‑Money 匯入的歷史交易，為保留原始資料只能檢視。需要修正時請另外建立調整交易。</p><p id="detail-error" class="error" role="alert"></p><button id="save-detail" type="submit">儲存修改</button></form></dialog><script>
// 這份複本是專門部署到 GitHub Pages 的靜態網站（背後完全沒有 Python 伺服器），
// 一定要用離線引擎，不能像原始專案的 index.html 那樣依賴網址帶不帶 ?offline=1——
// 那個參數容易在分享連結、直接輸入網址、或瀏覽器記住的舊網址時弄丟；沒有它，
// 離線引擎不會啟用，畫面上所有 API 呼叫都會打去這個網站根本不存在的後端，
// GitHub Pages 只能回一個 404 的 HTML 網頁，被 .json() 解析後就是
// 「Unexpected token '<'」這種看起來莫名其妙的錯誤（朋友手機上實際發生過）。
// 用 document.write 同步插入，確保在 app.js 執行「之前」就把 fetch() 換掉。
(function () {
  localStorage.setItem("accounting-offline-engine", "1");
  document.write('<script src="/offline/offline-backend.js"><\/script>');
})();
</script>
<script src="/app.js?v=95" defer></script><script src="/sync.js?v=4" defer></script><script type="module" src="/offline/google-auth.js?v=1"></script><script src="/offline/sync-ui.js?v=10" defer></script><script src="/offline/onboarding.js?v=1" defer></script></body></html>
